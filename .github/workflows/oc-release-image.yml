name: OC release image

# One Country's build of lago-api: the pinned upstream release plus the Authorize.net provider
# commits. Lives only on the oc/release branch, never on the upstream PR branch.
# Images: ghcr.io/one-country/lago-api:<tag> for tags v<upstream>-oc.<n>, and :oc-release-<sha> for every push.
on:
  push:
    branches: [oc/release]
    tags: ["v*-oc.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/one-country/lago-api
          tags: |
            type=ref,event=tag
            type=sha,prefix=oc-release-,format=short

      # amd64 only: Railway runs amd64. Same Dockerfile and dependency set as the OSS release
      # (no sidekiq-pro secret).
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
